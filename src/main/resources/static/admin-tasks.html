<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Management - Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand shadow-sm bg-body border-bottom">
    <div class="container-fluid px-4 py-2">
        <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
            🏢 Office Management <span class="badge bg-success fs-7 fw-normal ms-2">Task Manager</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="darkModeToggle">🌙 Dark Mode</button>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">⬅ Back to Hub</a>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- Task Assignment Section -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-success text-white py-3 px-4 fw-semibold">📌 Assign Task to Employee</div>
        <div class="card-body p-4">
            <form id="taskForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Select Employee</label>
                        <select id="taskEmployeeSelect" class="form-select" required>
                            <option value="">Choose employee...</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Task Title</label>
                        <input type="text" id="taskTitle" class="form-control" placeholder="e.g. Q3 Audit Report" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Description</label>
                        <input type="text" id="taskDesc" class="form-control" placeholder="Brief details..." required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-success px-4 fw-semibold shadow-sm">Assign Task</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Active Company Tasks List Table -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-dark text-white py-3 px-4">
            <span class="fw-semibold">📋 Active Company Tasks</span>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">Task</th>
                        <th>Assigned To</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th class="text-end pe-4">Action</th>
                    </tr>
                    </thead>
                    <tbody id="taskTableBody"></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body py-3" id="toastMessage">Action successful!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-tasks.js"></script>
</body>
</html>
