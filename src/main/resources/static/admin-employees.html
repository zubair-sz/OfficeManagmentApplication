<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management - Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">

<nav class="navbar navbar-expand shadow-sm bg-body border-bottom">
    <div class="container-fluid px-4 py-2">
        <a class="navbar-brand fw-bold text-primary" href="dashboard.html">
            🏢 Office Management <span class="badge bg-primary fs-7 fw-normal ms-2">Employee Manager</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="darkModeToggle">🌙 Dark Mode</button>
            <a href="dashboard.html" class="btn btn-outline-secondary btn-sm">⬅ Back to Hub</a>
            <button class="btn btn-success btn-sm shadow-sm" id="exportBtn">📥 Export to CSV</button>
        </div>
    </div>
</nav>

<div class="container py-4">
    <!-- Add / Edit Employee Form -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white py-3 px-4 fw-semibold" id="formHeader">✨ Add New Employee</div>
        <div class="card-body p-4">
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. John Smith" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. john@company.com" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Department</label>
                        <input type="text" id="department" class="form-control" placeholder="e.g. Engineering" required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm" id="saveButton">Save Employee</button>
                    <button type="button" class="btn btn-outline-secondary d-none ms-2 px-3" id="cancelButton">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee List Table with Filters & Search -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3 px-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <span class="fw-semibold">📋 Employee Directory</span>
            <div class="d-flex gap-2 flex-wrap">
                <select id="rowsPerPageSelect" class="form-select form-select-sm" style="width: 120px;">
                    <option value="5">5 per page</option>
                    <option value="10" selected>10 per page</option>
                    <option value="25">25 per page</option>
                </select>
                <select id="departmentFilter" class="form-select form-select-sm" style="width: 160px;">
                    <option value="">All Departments</option>
                </select>
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search name/email..." style="width: 200px;">
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTableBody"></tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-body d-flex justify-content-between align-items-center py-3 px-4">
            <span class="text-muted fs-7" id="paginationInfo">Showing 0 of 0 entries</span>
            <nav aria-label="Page navigation">
                <ul class="pagination pagination-sm mb-0" id="paginationControls"></ul>
            </nav>
        </div>
    </div>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body py-3" id="toastMessage">Action successful!</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/admin-employees.js"></script>
</body>
</html>
