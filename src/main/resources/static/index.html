<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🏢 Office Management System</a>
        <button class="btn btn-outline-light btn-sm" onclick="exportToCSV()">📥 Export to CSV</button>
    </div>
</nav>

<div class="container my-4">

    <!-- Dashboard Statistics Cards -->
    <div class="row g-3 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-start border-primary border-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-1">Total Employees</h6>
                    <h3 class="fw-bold text-primary mb-0" id="totalEmployeesCount">0</h3>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-start border-success border-4">
                <div class="card-body">
                    <h6 class="text-muted text-uppercase fs-7 mb-1">Active Departments</h6>
                    <h3 class="fw-bold text-success mb-0" id="totalDepartmentsCount">0</h3>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Employee Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white" id="formHeader">Add New Employee</div>
        <div class="card-body">
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="department" class="form-control" placeholder="Department" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveButton">Save Employee</button>
                    <button type="button" class="btn btn-secondary d-none ms-2" id="cancelButton" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee List Table with Filters & Search -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>Employee Directory</span>
            <div class="d-flex gap-2">
                <!-- Department Filter Dropdown -->
                <select id="departmentFilter" class="form-select form-select-sm" style="width: 160px;" onchange="filterTable()">
                    <option value="">All Departments</option>
                </select>
                <!-- Search Input -->
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search name/email..." style="width: 200px;" oninput="filterTable()">
            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <!-- Dynamic data loads here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Toast Notification Container (Bottom-Right) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="toastMessage">
                Action successful!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle for Toasts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'http://localhost:8080/api/employees';
    let allEmployeesCache = [];

    async function fetchEmployees() {
        try {
            const response = await fetch(API_URL);
            allEmployeesCache = await response.json();

            updateDashboardStats(allEmployeesCache);
            populateDepartmentDropdown(allEmployeesCache);
            filterTable();
        } catch (error) {
            console.error('Error fetching employees:', error);
            showToast('Failed to load employees from server.', 'bg-danger');
        }
    }

    // Update dashboard statistics cards
    function updateDashboardStats(employees) {
        const totalEmp = employees.length;
        const uniqueDepts = new Set(employees.map(emp => emp.department ? emp.department.trim().toLowerCase() : ''));
        document.getElementById('totalEmployeesCount').innerText = totalEmp;
        document.getElementById('totalDepartmentsCount').innerText = uniqueDepts.size;
    }

    // Populate Department Filter Dropdown dynamically
    function populateDepartmentDropdown(employees) {
        const dropdown = document.getElementById('departmentFilter');
        const currentSelection = dropdown.value;

        // Extract unique department names preserving original casing
        const deptMap = new Map();
        employees.forEach(emp => {
            if (emp.department) {
                const trimmed = emp.department.trim();
                deptMap.set(trimmed.toLowerCase(), trimmed);
            }
        });

        dropdown.innerHTML = '<option value="">All Departments</option>';
        deptMap.forEach((originalName) => {
            const option = document.createElement('option');
            option.value = originalName.toLowerCase();
            option.textContent = originalName;
            dropdown.appendChild(option);
        });

        dropdown.value = currentSelection;
    }

    // Combined filtering for Search input and Department dropdown
    function filterTable() {
        const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedDept = document.getElementById('departmentFilter').value;

        const filtered = allEmployeesCache.filter(emp => {
            const matchesSearch = !searchQuery ||
                (emp.name && emp.name.toLowerCase().includes(searchQuery)) ||
                (emp.email && emp.email.toLowerCase().includes(searchQuery));

            const matchesDept = !selectedDept ||
                (emp.department && emp.department.trim().toLowerCase() === selectedDept);

            return matchesSearch && matchesDept;
        });

        renderTable(filtered);
    }

    // Render table rows
    function renderTable(employees) {
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = '';

        if (employees.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No employees found</td></tr>`;
            return;
        }

        employees.forEach(emp => {
            tbody.innerHTML += `
                <tr>
                    <td>${emp.id}</td>
                    <td>${emp.name}</td>
                    <td>${emp.email}</td>
                    <td>${emp.department}</td>
                    <td>
                        <button class="btn btn-warning btn-sm me-1" onclick="prepareEdit(${emp.id}, '${emp.name}', '${emp.email}', '${emp.department}')">Edit</button>
                        <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    // Export cached or filtered employee directory to CSV
    function exportToCSV() {
        if (allEmployeesCache.length === 0) {
            showToast('No data available to export.', 'bg-warning text-dark');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,ID,Name,Email,Department\r\n";
        allEmployeesCache.forEach(emp => {
            csvContent += `"${emp.id}","${emp.name}","${emp.email}","${emp.department}"\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "employee_directory.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast('Employee directory exported successfully!', 'bg-success');
    }

    // Sleek Toast Notification Trigger
    function showToast(message, bgClass = 'bg-success') {
        const toastEl = document.getElementById('liveToast');
        const toastMessage = document.getElementById('toastMessage');

        toastEl.className = `toast align-items-center text-white border-0 ${bgClass}`;
        toastMessage.innerText = message;

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    // Form editing preparation
    function prepareEdit(id, name, email, department) {
        document.getElementById('employeeId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('department').value = department;

        document.getElementById('formHeader').innerText = 'Edit Employee (ID: ' + id + ')';
        document.getElementById('saveButton').innerText = 'Update Employee';
        document.getElementById('cancelButton').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reset form back to add mode
    function resetForm() {
        document.getElementById('employeeForm').reset();
        document.getElementById('employeeId').value = '';
        document.getElementById('formHeader').innerText = 'Add New Employee';
        document.getElementById('saveButton').innerText = 'Save Employee';
        document.getElementById('cancelButton').classList.add('d-none');
    }

    // Form submission (Create / Update)
    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('employeeId').value;
        const isEditing = !!id;

        const employeeData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value
        };

        if (isEditing) {
            employeeData.id = Number(id);
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            });

            if (!response.ok) throw new Error('Failed to save employee');

            resetForm();
            fetchEmployees();
            showToast(isEditing ? 'Employee updated successfully!' : 'Employee added successfully!');
        } catch (error) {
            console.error('Error saving employee:', error);
            showToast('Could not save employee. Check console logs.', 'bg-danger');
        }
    });

    // Delete employee
    async function deleteEmployee(id) {
        if (confirm('Are you sure you want to delete this employee?')) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchEmployees();
                showToast('Employee deleted successfully!', 'bg-dark');
            } catch (error) {
                console.error('Error deleting employee:', error);
                showToast('Failed to delete employee.', 'bg-danger');
            }
        }
    }

    // Initial load
    fetchEmployees();
</script>
</body>
</html>
