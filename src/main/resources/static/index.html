<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🏢 Office Management System</a>
    </div>
</nav>

<div class="container my-4">
    <!-- Add / Edit Employee Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white" id="formHeader">Add New Employee</div>
        <div class="card-body">
            <form id="employeeForm">
                <!-- Hidden ID field to track edits -->
                <input type="hidden" id="employeeId">

                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="department" class="form-control" placeholder="Department" required>
                    </div>
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success" id="saveButton">Save Employee</button>
                    <button type="button" class="btn btn-secondary d-none ms-2" id="cancelButton" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee List Table with Search Bar -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
            <span>Employee Directory</span>
            <!-- Search Input -->
            <div class="input-group" style="width: 250px;">
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search name/dept...">
            </div>
        </div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <!-- Dynamic data will load here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'http://localhost:8080/api/employees';

    async function fetchEmployees(keyword = '') {
        try {
            let url = API_URL;
            if (keyword) {
                url += `?keyword=${encodeURIComponent(keyword)}`;
            }
            const response = await fetch(url);
            const employees = await response.json();
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';

            if (employees.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted">No employees found</td></tr>`;
                return;
            }

            employees.forEach(emp => {
                tbody.innerHTML += `
                    <tr>
                        <td>${emp.id}</td>
                        <td>${emp.name}</td>
                        <td>${emp.email}</td>
                        <td>${emp.department}</td>
                        <td>
                            <button class="btn btn-warning btn-sm me-1" onclick="prepareEdit(${emp.id}, '${emp.name}', '${emp.email}', '${emp.department}')">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error fetching employees:', error);
        }
    }

    // Populate form for editing
    function prepareEdit(id, name, email, department) {
        document.getElementById('employeeId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('department').value = department;

        document.getElementById('formHeader').innerText = 'Edit Employee (ID: ' + id + ')';
        document.getElementById('saveButton').innerText = 'Update Employee';
        document.getElementById('cancelButton').classList.remove('d-none');

        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reset form back to 'Add' mode
    function resetForm() {
        document.getElementById('employeeForm').reset();
        document.getElementById('employeeId').value = '';
        document.getElementById('formHeader').innerText = 'Add New Employee';
        document.getElementById('saveButton').innerText = 'Save Employee';
        document.getElementById('cancelButton').classList.add('d-none');
    }

    // Search bar event listener
    document.getElementById('searchInput').addEventListener('input', (e) => {
        fetchEmployees(e.target.value);
    });

    // Handle form submit (Supports both Create and Update)
    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('employeeId').value;
        const employeeData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value
        };

        // If editing, include the ID so Hibernate updates instead of inserting
        if (id) {
            employeeData.id = Number(id);
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            });

            if (!response.ok) {
                throw new Error('Failed to save employee');
            }

            resetForm();
            const currentKeyword = document.getElementById('searchInput').value;
            fetchEmployees(currentKeyword);
        } catch (error) {
            console.error('Error saving employee:', error);
            alert('Could not save employee. Check console/backend logs.');
        }
    });

    async function deleteEmployee(id) {
        if (confirm('Are you sure you want to delete this employee?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            const currentKeyword = document.getElementById('searchInput').value;
            fetchEmployees(currentKeyword);
        }
    }

    // Initial load
    fetchEmployees();
</script>
</body>
</html>
