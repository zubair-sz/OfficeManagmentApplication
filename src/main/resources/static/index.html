<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">🏢 Office Management System</a>
    </div>
</nav>

<div class="container my-4">
    <!-- Add Employee Form -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">Add New Employee</div>
        <div class="card-body">
            <form id="employeeForm">
                <div class="row g-3">
                    <div class="col-md-4">
                        <input type="text" id="name" class="form-control" placeholder="Full Name" required>
                    </div>
                    <div class="col-md-4">
                        <input type="email" id="email" class="form-control" placeholder="Email Address" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" id="department" class="form-control" placeholder="Department" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success mt-3">Save Employee</button>
            </form>
        </div>
    </div>

    <!-- Employee List Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-secondary text-white">Employee Directory</div>
        <div class="card-body">
            <table class="table table-striped align-middle">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Action</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <!-- Dynamic data will load here -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Updated absolute URL to explicitly connect to your Spring Boot backend on port 8080
    const API_URL = 'http://localhost:8080/api/employees';

    async function fetchEmployees() {
        try {
            const response = await fetch(API_URL);
            const employees = await response.json();
            const tbody = document.getElementById('employeeTableBody');
            tbody.innerHTML = '';
            employees.forEach(emp => {
                tbody.innerHTML += `
                        <tr>
                            <td>${emp.id}</td>
                            <td>${emp.name}</td>
                            <td>${emp.email}</td>
                            <td>${emp.department}</td>
                            <td><button class="btn btn-danger btn-sm" onclick="deleteEmployee(${emp.id})">Delete</button></td>
                        </tr>
                    `;
            });
        } catch (error) {
            console.error('Error fetching employees:', error);
        }
    }

    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const newEmp = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value
        };

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newEmp)
            });

            if (!response.ok) {
                throw new Error('Failed to create employee');
            }

            document.getElementById('employeeForm').reset();
            fetchEmployees();
        } catch (error) {
            console.error('Error saving employee:', error);
            alert('Could not save employee. Check console/backend logs.');
        }
    });

    async function deleteEmployee(id) {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchEmployees();
    }

    fetchEmployees();
</script>
</body>
</html>
