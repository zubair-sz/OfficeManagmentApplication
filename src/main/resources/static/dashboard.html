<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Office Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .stat-card {
            border-left: 5px solid;
            transition: transform 0.2s ease;
        }
        .stat-card:hover {
            transform: translateY(-2px);
        }
        .table th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body class="bg-body-tertiary">

<!-- Navbar -->
<nav class="navbar navbar-expand shadow-sm bg-body border-bottom">
    <div class="container-fluid px-4 py-2">
        <a class="navbar-brand fw-bold text-primary" href="index.html">
            🏢 Office Management <span class="badge bg-secondary fs-7 fw-normal ms-2">Dashboard</span>
        </a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary btn-sm rounded-pill px-3" id="darkModeToggle" onclick="toggleDarkMode()">🌙 Dark Mode</button>
            <a href="index.html" class="btn btn-outline-primary btn-sm">🏠 Home</a>
            <button class="btn btn-success btn-sm shadow-sm" onclick="exportToCSV()">📥 Export to CSV</button>
        </div>
    </div>
</nav>

<div class="container py-4">

    <!-- Dashboard Statistics Cards -->
    <div class="row g-4 mb-4">
        <div class="col-md-6">
            <div class="card shadow-sm border-0 stat-card" style="border-left-color: #3b82f6 !important;">
                <div class="card-body p-4">
                    <h6 class="text-muted text-uppercase fs-7 mb-1 fw-semibold">Total Employees</h6>
                    <h2 class="fw-bold text-primary mb-0" id="totalEmployeesCount">0</h2>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow-sm border-0 stat-card" style="border-left-color: #10b981 !important;">
                <div class="card-body p-4">
                    <h6 class="text-muted text-uppercase fs-7 mb-1 fw-semibold">Active Departments</h6>
                    <h2 class="fw-bold text-success mb-0" id="totalDepartmentsCount">0</h2>
                </div>
            </div>
        </div>
    </div>

    <!-- Add / Edit Employee Form -->
    <div class="card shadow-sm border-0 mb-4">
        <div class="card-header bg-primary text-white py-3 px-4 fw-semibold" id="formHeader">✨ Add New Employee</div>
        <div class="card-body p-4">
            <form id="employeeForm">
                <input type="hidden" id="employeeId">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Full Name</label>
                        <input type="text" id="name" class="form-control" placeholder="e.g. John Smith" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="e.g. john@company.com" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label text-muted fs-7">Department</label>
                        <input type="text" id="department" class="form-control" placeholder="e.g. Engineering" required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary px-4 fw-semibold shadow-sm" id="saveButton">Save Employee</button>
                    <button type="button" class="btn btn-outline-secondary d-none ms-2 px-3" id="cancelButton" onclick="resetForm()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Employee List Table with Filters & Search -->
    <div class="card shadow-sm border-0">
        <div class="card-header bg-dark text-white py-3 px-4 d-flex flex-wrap justify-content-between align-items-center gap-3">
            <span class="fw-semibold">📋 Employee Directory</span>
            <div class="d-flex gap-2">
                <!-- Department Filter Dropdown -->
                <select id="departmentFilter" class="form-select form-select-sm" style="width: 170px;" onchange="filterTable()">
                    <option value="">All Departments</option>
                </select>
                <!-- Search Input -->
                <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Search name/email..." style="width: 210px;" oninput="filterTable()">
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                    </thead>
                    <tbody id="employeeTableBody">
                    <!-- Dynamic data loads here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Toast Notification Container (Bottom-Right) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="liveToast" class="toast align-items-center text-white bg-success border-0 shadow-lg" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body py-3" id="toastMessage">
                Action successful!
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle for Toasts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = 'http://localhost:8080/api/employees';
    let allEmployeesCache = [];

    // Dark Mode Handling
    function toggleDarkMode() {
        const htmlElement = document.documentElement;
        const toggleBtn = document.getElementById('darkModeToggle');

        if (htmlElement.getAttribute('data-bs-theme') === 'dark') {
            htmlElement.setAttribute('data-bs-theme', 'light');
            toggleBtn.innerHTML = '🌙 Dark Mode';
            localStorage.setItem('theme', 'light');
        } else {
            htmlElement.setAttribute('data-bs-theme', 'dark');
            toggleBtn.innerHTML = '☀️ Light Mode';
            localStorage.setItem('theme', 'dark');
        }
    }

    window.addEventListener('DOMContentLoaded', () => {
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-bs-theme', savedTheme);
        const toggleBtn = document.getElementById('darkModeToggle');
        if (toggleBtn) {
            toggleBtn.innerHTML = savedTheme === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode';
        }
        fetchEmployees();
    });

    async function fetchEmployees() {
        try {
            const response = await fetch(API_URL);
            allEmployeesCache = await response.json();

            updateDashboardStats(allEmployeesCache);
            populateDepartmentDropdown(allEmployeesCache);
            filterTable();
        } catch (error) {
            console.error('Error fetching employees:', error);
            showToast('Failed to load employees from server.', 'bg-danger');
        }
    }

    function updateDashboardStats(employees) {
        const totalEmp = employees.length;
        const uniqueDepts = new Set(employees.map(emp => emp.department ? emp.department.trim().toLowerCase() : ''));
        document.getElementById('totalEmployeesCount').innerText = totalEmp;
        document.getElementById('totalDepartmentsCount').innerText = uniqueDepts.size;
    }

    function populateDepartmentDropdown(employees) {
        const dropdown = document.getElementById('departmentFilter');
        const currentSelection = dropdown.value;

        const deptMap = new Map();
        employees.forEach(emp => {
            if (emp.department) {
                const trimmed = emp.department.trim();
                deptMap.set(trimmed.toLowerCase(), trimmed);
            }
        });

        dropdown.innerHTML = '<option value="">All Departments</option>';
        deptMap.forEach((originalName) => {
            const option = document.createElement('option');
            option.value = originalName.toLowerCase();
            option.textContent = originalName;
            dropdown.appendChild(option);
        });

        dropdown.value = currentSelection;
    }

    function filterTable() {
        const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
        const selectedDept = document.getElementById('departmentFilter').value;

        const filtered = allEmployeesCache.filter(emp => {
            const matchesSearch = !searchQuery ||
                (emp.name && emp.name.toLowerCase().includes(searchQuery)) ||
                (emp.email && emp.email.toLowerCase().includes(searchQuery));

            const matchesDept = !selectedDept ||
                (emp.department && emp.department.trim().toLowerCase() === selectedDept);

            return matchesSearch && matchesDept;
        });

        renderTable(filtered);
    }

    function renderTable(employees) {
        const tbody = document.getElementById('employeeTableBody');
        tbody.innerHTML = '';

        if (employees.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5" class="text-center text-muted py-4">No employees found</td></tr>`;
            return;
        }

        employees.forEach(emp => {
            tbody.innerHTML += `
                <tr>
                    <td class="ps-4 fw-semibold">#${emp.id}</td>
                    <td>${emp.name}</td>
                    <td class="text-muted">${emp.email}</td>
                    <td><span class="badge bg-secondary bg-opacity-10 text-secondary border px-2 py-1">${emp.department}</span></td>
                    <td class="text-end pe-4">
                        <button class="btn btn-outline-warning btn-sm me-1 px-3" onclick="prepareEdit(${emp.id}, '${emp.name}', '${emp.email}', '${emp.department}')">Edit</button>
                        <button class="btn btn-outline-danger btn-sm px-3" onclick="deleteEmployee(${emp.id})">Delete</button>
                    </td>
                </tr>
            `;
        });
    }

    function exportToCSV() {
        if (allEmployeesCache.length === 0) {
            showToast('No data available to export.', 'bg-warning text-dark');
            return;
        }

        let csvContent = "data:text/csv;charset=utf-8,ID,Name,Email,Department\r\n";
        allEmployeesCache.forEach(emp => {
            csvContent += `"${emp.id}","${emp.name}","${emp.email}","${emp.department}"\r\n`;
        });

        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", "employee_directory.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        showToast('Employee directory exported successfully!', 'bg-success');
    }

    function showToast(message, bgClass = 'bg-success') {
        const toastEl = document.getElementById('liveToast');
        const toastMessage = document.getElementById('toastMessage');

        toastEl.className = `toast align-items-center text-white border-0 shadow-lg ${bgClass}`;
        toastMessage.innerText = message;

        const toast = new bootstrap.Toast(toastEl);
        toast.show();
    }

    function prepareEdit(id, name, email, department) {
        document.getElementById('employeeId').value = id;
        document.getElementById('name').value = name;
        document.getElementById('email').value = email;
        document.getElementById('department').value = department;

        document.getElementById('formHeader').innerText = '✏️ Edit Employee (ID: ' + id + ')';
        document.getElementById('saveButton').innerText = 'Update Changes';
        document.getElementById('cancelButton').classList.remove('d-none');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('employeeForm').reset();
        document.getElementById('employeeId').value = '';
        document.getElementById('formHeader').innerText = '✨ Add New Employee';
        document.getElementById('saveButton').innerText = 'Save Employee';
        document.getElementById('cancelButton').classList.add('d-none');
    }

    document.getElementById('employeeForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const id = document.getElementById('employeeId').value;
        const isEditing = !!id;

        const employeeData = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            department: document.getElementById('department').value
        };

        if (isEditing) {
            employeeData.id = Number(id);
        }

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(employeeData)
            });

            if (!response.ok) throw new Error('Failed to save employee');

            resetForm();
            fetchEmployees();
            showToast(isEditing ? 'Employee updated successfully!' : 'Employee added successfully!');
        } catch (error) {
            console.error('Error saving employee:', error);
            showToast('Could not save employee. Check console logs.', 'bg-danger');
        }
    });

    async function deleteEmployee(id) {
        if (confirm('Are you sure you want to delete this employee?')) {
            try {
                await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                fetchEmployees();
                showToast('Employee deleted successfully!', 'bg-dark');
            } catch (error) {
                console.error('Error deleting employee:', error);
                showToast('Failed to delete employee.', 'bg-danger');
            }
        }
    }
</script>
</body>
</html>
